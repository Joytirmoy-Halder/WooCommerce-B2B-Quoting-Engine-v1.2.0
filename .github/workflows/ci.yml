name: CI

on:
  push:
    branches:
      - main
      - 'audit/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: PHP ${{ matrix.php }} syntax
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Every version the plugin header claims to support.
        php: ['7.4', '8.0', '8.1', '8.2', '8.3']

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: none

      - name: Lint every PHP file
        run: |
          find . -type f -name '*.php' -not -path './vendor/*' -print0 \
            | xargs -0 -n1 -P4 php -l

  standards:
    name: WordPress Coding Standards
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer

      - name: Validate Composer configuration
        run: composer validate --no-check-lock --no-check-publish

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      # Emit findings in GitHub's annotation format as well as the full
      # report, so every violation shows up inline on the pull request diff
      # instead of only in the raw log.
      - name: Run PHPCS
        run: vendor/bin/phpcs --report-full --report-github

  package:
    name: Consistency checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Version numbers agree
        run: |
          header=$(grep -m1 '^ \* Version:' woo-b2b-quoting-engine.php | tr -d ' ' | cut -d: -f2)
          constant=$(grep -m1 "B2B_QUOTE_VERSION', '" woo-b2b-quoting-engine.php | cut -d"'" -f4)
          stable=$(grep -m1 '^Stable tag:' readme.txt | tr -d ' ' | cut -d: -f2)
          echo "header=$header constant=$constant readme=$stable"
          test "$header" = "$constant"
          test "$header" = "$stable"

      - name: No build artefacts committed
        run: |
          if git ls-files | grep -E '\.(zip|tar\.gz)$'; then
            echo 'Distribution archives must not be committed.' >&2
            exit 1
          fi
